<form
  action="https://formsubmit.co/sreesaitools@gmail.com"
  method="POST"
  enctype="multipart/form-data"
>

  <input
    type="hidden"
    name="_subject"
    value="New RFQ & Drawing - Sree Sai Cutting Tools Pvt Ltd."
  >

  <input
    type="hidden"
    name="_template"
    value="table"
  >

  <input
    type="text"
    name="_honey"
    style="display:none"
  >

  <label>Contact Name</label>
  <input
    type="text"
    name="Contact Name"
    required
  >

  <label>Company</label>
  <input
    type="text"
    name="Company"
    required
  >

  <label>Email</label>
  <input
    type="email"
    name="email"
    required
  >

  <label>Phone</label>
  <input
    type="text"
    name="Phone"
  >

  <label>Tool Type</label>
  <select name="Tool Type" required>
    <option value="">Select</option>
    <option>Gear Hob</option>
    <option>Spline Hob</option>
    <option>Spline Milling Cutter</option>
    <option>Sprocket / Chain Hob</option>
    <option>Ratchet Cutter</option>
    <option>Form Milling Cutter</option>
    <option>Special Cutting Tool</option>
  </select>

  <label>Quantity</label>
  <input
    type="number"
    name="Quantity"
    min="1"
  >

  <label>Module / DP / Pitch</label>
  <input
    type="text"
    name="Module / DP / Pitch"
  >

  <label>Pressure Angle</label>
  <input
    type="text"
    name="Pressure Angle"
  >

  <label>Number of Teeth / Starts</label>
  <input
    type="text"
    name="Teeth / Starts"
  >

  <label>RH / LH</label>
  <select name="Hand">
    <option value="">Select</option>
    <option>RH</option>
    <option>LH</option>
  </select>

  <label>Tool Size</label>
  <input
    type="text"
    name="Tool Size"
    placeholder="OD x Length x Bore"
  >

  <label>Material Grade</label>
  <input
    type="text"
    name="Material Grade"
    placeholder="M2 / M35 / M42 / M50 / ASP30 / ASP2030"
  >

  <label>Coating</label>
  <input
    type="text"
    name="Coating"
  >

  <label>Required Delivery</label>
  <input
    type="text"
    name="Required Delivery"
  >

  <label>Application / Additional Details</label>
  <textarea
    name="Application / Additional Details"
    rows="6"
  ></textarea>

  <label>Upload Drawing / Specification</label>
  <input
    type="file"
    name="attachment"
    required
    accept=".pdf,.dwg,.dxf,.step,.stp,.igs,.iges,.jpg,.jpeg,.png,.zip"
  >

  <p>
    Maximum total attachment size: 10 MB.
  </p>

  <button type="submit">
    Submit RFQ & Drawing
  </button>

</form>
